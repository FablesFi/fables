[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{access = "read", path = "./src"}]

[profile.default.fuzz]
runs = 1024

[profile.default.invariant]
runs = 64
depth = 25
fail_on_revert = true

[profile.deep.invariant]
runs = 600
depth = 120

[lint]
lint_on_build = false

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
ignore = ["src/vendor/**"]

